name: "Stale issues and PRs"
on:
  schedule:
    - cron: "30 8 * * 1"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been open for 60 days with no activity. It will be
            closed automatically in 14 days unless there is new activity.
          stale-pr-message: >
            This PR has been open for 30 days with no activity. It will be
            closed automatically in 14 days unless there is new activity.
          close-issue-message: "Closing due to inactivity."
          close-pr-message: "Closing due to inactivity."
          days-before-stale: 60
          days-before-pr-stale: 30
          days-before-close: 14
          days-before-pr-close: 14
          exempt-issue-labels: "pinned,security,enhancement,help-wanted"
          exempt-pr-labels: "pinned,security,blocked"
